[project]
name = "tcm-research-platform"
version = "0.1.0"
description = "Evidence-first TCM research platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "pypdf>=6,<7",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcm_platform"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

