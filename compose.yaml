services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tcm_platform
      POSTGRES_USER: tcm
      POSTGRES_PASSWORD: tcm_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcm -d tcm_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:

